<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS3 | CodeStudio IDE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CodeMirror Assets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/lint/lint.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080c14; overflow: hidden; }
        .top-bar { background-color: #0b0f19; border-bottom: 1px solid #1f2937; }
        
        /* IDE Grid Splitting */
        .ide-container {
            display: flex;
            height: calc(100vh - 3.5rem);
            width: 100vw;
        }
        .ide-pane {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .resizer {
            width: 6px;
            background-color: #1f2937;
            cursor: col-resize;
            transition: background-color 0.2s;
            z-index: 10;
        }
        .resizer:hover, .resizer.active {
            background-color: #6366f1;
        }

        /* CodeMirror Overrides */
        .CodeMirror {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            height: 100% !important;
            background-color: #0f111a !important;
        }
        .CodeMirror-gutters {
            background-color: #0b0f19 !important;
            border-right: 1px solid #1f2937 !important;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen">

    <div class="top-bar h-14 flex items-center px-4 justify-between shrink-0 shadow-md z-10">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-2 text-sm text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors no-underline">
                <i class="fa-solid fa-arrow-left"></i> MS3 Hub
            </a>
            <div class="w-px h-6 bg-slate-700"></div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-code text-blue-400"></i>
                <span class="font-semibold text-sm text-slate-200">CodeStudio Workspace</span>
                <span class="ml-2 text-xs text-slate-400 px-2.5 py-0.5 bg-slate-800/80 rounded-md border border-slate-700 font-medium">Ctrl+Space Autocomplete</span>
            </div>
        </div>
        
        <div class="flex gap-2">
            <button id="format-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700 flex items-center font-medium">
                <i class="fa-solid fa-align-left mr-1.5"></i> Format
            </button>
            <button id="run-btn" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg shadow transition flex items-center font-medium">
                <i class="fa-solid fa-rotate-right mr-1.5"></i> Force Refresh
            </button>
        </div>
    </div>

    <div class="ide-container">
        <!-- Editor Pane -->
        <div class="ide-pane" id="editor-pane" style="width: 50%;">
            <div class="h-9 bg-[#111827] flex items-center px-4 text-xs text-slate-300 border-b border-slate-800 shrink-0 font-medium">
                <i class="fa-brands fa-html5 text-orange-400 mr-2 text-sm"></i> index.html (Source)
            </div>
            <div class="flex-1 overflow-hidden">
                <textarea id="code-editor"></textarea>
            </div>
        </div>
        
        <!-- Resizer Handle -->
        <div class="resizer" id="resizer"></div>

        <!-- Preview Pane -->
        <div class="ide-pane" id="preview-pane" style="flex: 1;">
            <div class="h-9 bg-[#111827] flex items-center justify-between px-4 text-xs text-slate-300 border-b border-slate-800 shrink-0 font-medium">
                <div class="flex items-center">
                    <i class="fa-solid fa-desktop text-emerald-400 mr-2 text-sm"></i> Live Output Preview
                </div>
                <button id="fullscreen-btn" class="text-slate-400 hover:text-white transition p-1.5 rounded hover:bg-slate-800" title="Fullscreen Preview">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
            <div class="flex-1 bg-white relative w-full h-full" id="preview-wrapper">
                <iframe id="preview-frame" class="absolute inset-0 w-full h-full border-0 bg-white" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Linters -->
    <script src="https://unpkg.com/jshint@2.13.6/dist/jshint.js"></script>
    <script src="https://unpkg.com/htmlhint@1.1.3/dist/htmlhint.js"></script>
    <script src="https://unpkg.com/csslint@1.0.5/dist/csslint.js"></script>

    <!-- CodeMirror Core & Modes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    
    <!-- CodeMirror Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/xml-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/html-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/javascript-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/css-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/lint/lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/lint/javascript-lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/lint/html-lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/lint/css-lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>

    <script>
        const defaultCode = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MS3 Interactive Canvas</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; font-family: 'Inter', sans-serif; color: white;}
        .card { padding: 2.5rem; background: #1e293b; border-radius: 16px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); cursor: pointer; border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s ease; }
        .card:hover { transform: translateY(-4px); border-color: #6366f1; }
        h2 { margin-top: 0; color: #818cf8; }
    </style>
</head>
<body>
    <div class="card" id="clickBox">
        <h2>CodeStudio Active!</h2>
        <p>Click this card to randomize its background glow.</p>
    </div>

    <script>
        const box = document.getElementById('clickBox');
        const colors = ['#1e293b', '#312e81', '#14532d', '#701a75', '#7c2d12'];
        box.addEventListener('click', () => {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            box.style.backgroundColor = randomColor;
        });
    <\/script>
</body>
</html>`;

        const textarea = document.getElementById('code-editor');
        textarea.value = defaultCode;

        // Initialize CodeMirror
        const editor = CodeMirror.fromTextArea(textarea, {
            mode: "htmlmixed",
            theme: "material-darker",
            lineNumbers: true,
            autoCloseTags: true,
            autoCloseBrackets: true,
            matchBrackets: true,
            indentUnit: 4,
            gutters: ["CodeMirror-lint-markers", "CodeMirror-linenumbers"],
            lint: true,
            extraKeys: { "Ctrl-Space": "autocomplete" }
        });

        // Live Preview Logic
        const previewFrame = document.getElementById('preview-frame');
        
        function updatePreview() {
            const content = editor.getValue();
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            previewDoc.open();
            previewDoc.write(content);
            previewDoc.close();
        }

        // Debounce typing
        let debounceTimer;
        editor.on("change", () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreview, 500);
        });

        // Manual Refresh
        document.getElementById('run-btn').addEventListener('click', updatePreview);

        // Auto-Format
        document.getElementById('format-btn').addEventListener('click', () => {
            const totalLines = editor.lineCount();
            for (let i = 0; i < totalLines; i++) {
                editor.indentLine(i);
            }
        });

        // Resizer Logic
        const resizer = document.getElementById('resizer');
        const editorPane = document.getElementById('editor-pane');
        const ideContainer = document.querySelector('.ide-container');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            resizer.classList.add('active');
            previewFrame.style.pointerEvents = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerRect = ideContainer.getBoundingClientRect();
            let newWidth = ((e.clientX - containerRect.left) / containerRect.width) * 100;
            newWidth = Math.max(15, Math.min(newWidth, 85));
            editorPane.style.width = `${newWidth}%`;
            editor.refresh();
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('active');
                previewFrame.style.pointerEvents = 'auto';
            }
        });

        // Fullscreen Preview Logic
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const previewPane = document.getElementById('preview-pane');
        const fsIcon = fullscreenBtn.querySelector('i');

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                previewPane.requestFullscreen().catch(err => {
                    console.error("Error enabling fullscreen:", err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsIcon.classList.replace('fa-expand', 'fa-compress');
            } else {
                fsIcon.classList.replace('fa-compress', 'fa-expand');
            }
        });

        // Initial Load
        setTimeout(updatePreview, 100);
    </script>
</body>
</html>
