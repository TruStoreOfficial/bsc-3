<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS3 | EMU/RT Virtualization</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080c14; }
        .top-bar { background-color: #0b0f19; border-bottom: 1px solid #1f2937; }
        
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.3)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 45px rgba(245, 158, 11, 0.7)); transform: scale(1.02); }
        }
        .chip-glow {
            animation: pulse-glow 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">

    <!-- Top Control Bar -->
    <div class="top-bar h-14 flex items-center px-4 shrink-0 shadow-md z-10">
        <a href="index.html" class="flex items-center gap-2 text-sm text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors no-underline font-medium">
            <i class="fa-solid fa-arrow-left"></i> MS3 Hub
        </a>
        <div class="w-px h-6 bg-slate-700 mx-4"></div>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-microchip text-amber-400"></i>
            <span class="font-semibold text-sm text-slate-200">EMU/RT Virtualization</span>
        </div>
    </div>

    <!-- Development Content -->
    <div class="flex-1 flex flex-col items-center justify-center bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-[#080c14] to-black px-4">
        
        <div class="relative mb-10 chip-glow">
            <div class="absolute inset-0 bg-amber-500 blur-3xl opacity-20 rounded-full"></div>
            <i class="fa-solid fa-microchip text-8xl text-amber-400 relative z-10 drop-shadow-2xl"></i>
        </div>
        
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4 tracking-tight text-center">EMU/RT Core Virtualization</h1>
        
        <div class="flex items-center gap-3 bg-slate-900/90 border border-slate-800 px-5 py-2.5 rounded-full mb-8 shadow-inner backdrop-blur-sm">
            <span class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
            </span>
            <span class="text-amber-400 font-semibold text-xs tracking-widest uppercase">In Development &bull; Coming Soon</span>
        </div>
        
        <p class="text-slate-400 max-w-lg text-center leading-relaxed text-base">
            The architecture for the next-generation EMU/RT hardware emulation and real-time execution environment is currently being engineered under MS3.
        </p>
        
        <a href="index.html" class="mt-10 px-8 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-semibold transition border border-slate-700 shadow-lg no-underline">
            Return to MS3 Hub
        </a>
    </div>

</body>
</html>
